# GAFE01 - Animal Crossing (USA Rev 0)
# Animal Crossing VR / Quest 3 calibration.

[Graphics.VR]
UnitsPerMeter = 100.0
TrackingMode = 0
VirtualScreen = True
HudThickness = 0.0
SmallViewportsOnScreen = True

# Keep more submitted world geometry alive in the expanded Quest view. The OpenXR far plane is
# extended from Animal Crossing's short console camera while Dolphin's own CPU cull is disabled.
DisableCPUCull = True
FarClipMultiplier = 4.0

# Optional miniature diorama / god-view preset. It starts disabled so normal immersive play is
# unchanged; enable "Tabletop / God View" in the per-game VR Camera menu to use these values.
TabletopMode = True
TabletopHeight = 0.38
TabletopDistance = 0.12
TabletopPitch = -45.0
TabletopScale = 17.0

# Mixed-reality tabletop: black/unrendered background becomes the Quest camera feed.
Passthrough = True
PassthroughRemoveBlackBackground = True
PassthroughRemoveBlackEFBClears = True
PassthroughSceneOpacity = 1.0
PassthroughCoverageMode = 0
